<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <!-- Content here -->
      <fieldset>
        <h1>Inscrição / Contato</h1>

        <form>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
        <h4>Preencha os campos abaixo. Campos marcados com * são obrigatórios.</h4>
      
        <form action="" method="post">

        <legend><strong></strong></legend>
  
        <div class="row">
          <div class="col-6">
            <label class="form-label" for="nome_aluno">Nome</label>
            <input type="text" id="nome" name="nome" class="form-control" required placeholder="João">
          </div>
          <div class="col-6">
            <label class="form-label" for="sobrenome">Sobrenome</label>
            <input type="text" id="sobrenome" name="sobrenome" class="form-control" placeholder="Silva">
          </div>
        </div>
  
        <div class="row">
          <div class="col-6">
            <label class="form-label" for="email">E-Mail</label>
            <input type="text" id="email" name="email" class="form-control" placeholder="nome@exemplo.com">
          </div>
          <div class="col-6">
            <label class="form-label" for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" class="form-control" maxlength="15" placeholder="(61) 9 9999-9999">
          </div>
        </div>
  
        <div class="row">
            <div class="col-6">
                <label class="form-label" for="cpf">CPF</label>
                <input type="text" id="cpf" name="cpf" class="form-control" maxlength="14" placeholder="000.000.000.00">
            </div>  
          <div class="col-6">
            <label class="form-label" for="nascimento">Data de Nascimento</label>
            <input type="date" id="nascimento" class="form-control" name="nascimento">
          </div>
        </div>
        
        <div class="row">
          <div class="col-6">
            <label class="form-label" for="cpf">Senha</label>
            <input type="text" id="senha" name="senha" class="form-control" placeholder="Mínimo 6 caracteres">
          </div>
          <div class="col-6">
            <label class="form-label" for="funcao">Função</label>
            <select id="funcao" name="funcao" class="form-control">
              <option value="select-estado">Escolha...</option>
              <option value="1ano">1</option>
              <option value="2ano">2</option>
              <option value="3ano">3</option>
              <option value="4ano">4</option>
              <option value="5ano">5</option>
            </select>
          </div>
        </div>

        <div class="row">
            <label class="form-label" for="cpf">Usuário</label>
                <div class="col-1">
                    <input class="form-control" type="text" id="@" name="@" placeholder="@">
                </div>  
                <div class="col-11">
                    <input class="form-control" type="text" id="usuario" name="usuario" placeholder="nomeusuário">
                </div>  
        </div> 
        
        <div class="row">
            <div class="col-12">
                <label class="form-label" for="cpf">Mensagem</label>
                <input type="text" id="mensagem" name="mensagem" class="form-control" placeholder="Escreva aqui...">
            </div>  
        </div> 
        <br>
        <br>
        <br>

        <div class="row">
            <h4>Upload de Currículo (PDF)</h4>
            <div class="">
                <label class="form-label" for="cpf"></label>
                <input type="file" accept=".pdf" id="arquivo" name="arquivo" placeholder="Nenhum arquivo escolhido">
            </div> 
            <p>Máx. 5MB. Apenas PDF.</p> 
        </div> 

        <div class="row">
            <div class="col-4">
                <input type="radio" name="contato_email"  id="contato_email">
                <label class="form-label" for="">Quero receber novidades</label>
            </div>
            <div class="col-4">
                <input type="radio" name="contato_email" id="contato_email">
                <label class="form-label" for="">Contato por email</label>
            </div>
            <div class="col-4">
                <input type="radio" name="contato_email" id="contato_email">
                <label class="form-label" for="">Contato por telefone</label>
            </div>
        </div>

        <div class="">
            <button>Enviar Formulário</button>
            <button>Limpar Campos</button>
        </div>
        
    </form>
      </fieldset>
    </div>

</body>
</html>
